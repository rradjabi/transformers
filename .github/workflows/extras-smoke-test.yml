name: Extras Smoke Test

# Modified on this branch to run on the AMD Ryzen DevLab DISPATCH ephemeral
# pool instead of a GitHub-hosted ubuntu-latest runner. This is a proof-of-life
# branch, so the workflow is reduced to the part that demonstrates something:
# install transformers from this tree on the pool's hardware and import it.
#
# Changes from upstream, listed so they are easy to undo:
#   - workflow_dispatch added and the nightly schedule dropped, so this only
#     ever runs when somebody asks for it
#   - test-extras runs-on moved to the pool's label set
#   - the python matrix is pinned to one version rather than read from setup.py,
#     which removes the get-python-versions job this depended on
#   - the "install every extra" loop is dropped. On a hosted runner it is a
#     nightly that is allowed to take an hour; here it would hold a physical
#     host for that long to prove nothing this branch is trying to prove
#   - the Slack notification jobs are dropped, since they need org secrets a
#     fork does not have

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-extras:
    name: Install and import on the DevLab pool
    # `devlab-dispatch` is the opt-in token for the pool. A runner is built for
    # this job alone and destroyed when it finishes.
    runs-on: [self-hosted, Linux, devlab-dispatch]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Show the machine this landed on
        run: |
          echo "runner : ${RUNNER_NAME:-unknown}"
          echo "kernel : $(uname -srm)"
          echo "cpu    : $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          echo "cores  : $(nproc)"
          echo "memory : $(free -h | awk '/^Mem:/ {print $2}')"
          echo "disk   : $(df -h . | awk 'NR==2 {print $4}') free"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools

      - name: Install base package
        run: pip install -e .

      - name: Verify installation
        run: |
          python -c "import transformers; print(f'Transformers version: {transformers.__version__}')"
          python -c "from transformers import pipeline; print('Successfully imported pipeline')"

      - name: Report the AMD stack
        # Informational. A missing tool prints a line and does not fail the job.
        run: |
          command -v rocminfo >/dev/null && rocminfo | grep -m1 'Marketing Name' || echo "rocminfo : not installed"
          command -v xrt-smi  >/dev/null && xrt-smi examine | head -20          || echo "xrt-smi  : not installed"
